name: Release Extension

# 触发条件：
#   - release:published  —— 发布 GitHub Release 时自动打包本扩展
#   - workflow_dispatch  —— 手动触发（便于测试）
#
# 行为：将当前扩展目录打包为 zip（zip 根即扩展目录，内含 Extension.toml），
#       上传为 Release 资产。SHA-256 校验和由扩展商店仓库定时抓取时生成。

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Package extension
        id: package
        run: |
          set -euo pipefail

          DIST_DIR="dist"
          mkdir -p "$DIST_DIR"

          # 从清单读扩展 id 与版本号（[extension] 段的 id / version = "..."）
          manifest="Extension/Extension.toml"
          id="$(sed -n 's/^id[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$manifest" | head -n1)"
          id="${id:-example}"
          version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$manifest" | head -n1)"
          version="${version:-0.0.0}"

          zip_name="${id}-${version}.zip"
          zip_path="$DIST_DIR/$zip_name"

          # cd 进 Extension/ 目录后打包当前内容，使 zip 根直接是扩展内容
          # （Extension.toml、__init__.py 等在根目录），而非嵌套一层 Extension/ 文件夹。
          # -D 丢弃目录条目；排除 __pycache__/*.pyc/系统文件。
          (cd "$GITHUB_WORKSPACE/Extension" && zip -r -q -D "$OLDPWD/$zip_path" . \
            -x '*/.git/*' -x '*/.github/*' -x '*/__pycache__/*' -x '*.pyc' \
            -x '.DS_Store' -x '*.DS_Store')

          echo "zip_name=${zip_name}" >> "$GITHUB_OUTPUT"
          echo "✅ ${zip_name}"

      - name: Upload asset to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "dist/${{ steps.package.outputs.zip_name }}" \
            --repo "${{ github.repository }}" --clobber

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: dist/
          if-no-files-found: error